<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MANTEN LIMPIO</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f7fb;--card:#fff;--tx:#0b2a3c;--mut:#5f7a8a;--pri:#0aa5c2;--pri2:#0a6fb8;--ok:#14a86b;--bad:#e5484d;--line:#dbe8f0;--soft:#e6f6fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07151e;--card:#0f2431;--tx:#e8f4fa;--mut:#8fb0c1;--pri:#2cc7e3;--pri2:#3b9be0;--ok:#32d18f;--bad:#ff6b70;--line:#1d3a4b;--soft:#0f3140}}
:root[data-theme="dark"]{--bg:#07151e;--card:#0f2431;--tx:#e8f4fa;--mut:#8fb0c1;--pri:#2cc7e3;--pri2:#3b9be0;--ok:#32d18f;--bad:#ff6b70;--line:#1d3a4b;--soft:#0f3140}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;padding:22px 20px 70px;position:relative;overflow:hidden}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
header:before{width:180px;height:180px;right:-40px;top:-60px}header:after{width:100px;height:100px;right:90px;bottom:-40px}
.wrap{max-width:760px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.brand h1{margin:0;font-size:22px;letter-spacing:1.5px}.brand small{opacity:.9;display:block;font-size:12px}
nav{display:flex;gap:8px;margin-top:16px}
nav a{color:#fff;text-decoration:none;font-size:14px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.18);font-weight:600}
nav a.on{background:#fff;color:var(--pri2)}
main{max-width:760px;margin:-50px auto 40px;padding:0 16px;position:relative;z-index:2}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(10,60,90,.1);border:1px solid var(--line)}
h2{margin:0 0 14px;font-size:18px}h3{margin:0 0 10px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
input,select{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--pri)}
button{font-family:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:700;font-size:16px;padding:15px 18px}
.big{width:100%;margin-top:18px;color:#fff;background:linear-gradient(135deg,var(--pri2),var(--pri));box-shadow:0 8px 20px rgba(10,165,194,.35)}
.big.out{background:linear-gradient(135deg,#d6393f,#ff6b70);box-shadow:0 8px 20px rgba(229,72,77,.3)}
.big:disabled{opacity:.6}
.sec{background:var(--soft);color:var(--pri2);padding:10px 14px;font-size:14px;border-radius:10px}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;margin-top:14px;line-height:1.4}
.msg.err{background:rgba(229,72,77,.12);color:var(--bad)}.msg.ok{background:rgba(20,168,107,.13);color:var(--ok)}.msg.info{background:var(--soft);color:var(--pri2)}
.live{text-align:center;padding:10px 0}
.pulse{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ok);margin-right:8px;animation:p 1.5s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(20,168,107,.6)}100%{box-shadow:0 0 0 14px rgba(20,168,107,0)}}
.timer{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:16px;padding:14px 10px;text-align:center;background:var(--soft)}
.stat b{display:block;font-size:30px;color:var(--pri2)}.stat span{font-size:12px;color:var(--mut)}
.stat.main{background:linear-gradient(135deg,var(--ok),#0e8f5a);color:#fff}.stat.main b,.stat.main span{color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.row .i{flex:1;min-width:0}.row .i b{display:block}.row .i small{color:var(--mut)}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(20,168,107,.15);color:var(--ok);white-space:nowrap}
.tag.g{background:var(--soft);color:var(--mut)}
.mini{padding:8px 12px;font-size:13px;border-radius:10px;background:var(--soft);color:var(--pri2);text-decoration:none;display:inline-block;font-weight:700}
.mini.d{background:rgba(229,72,77,.12);color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns a{flex:1;text-align:center;padding:13px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;min-width:140px}
.wa{background:#25d366}.em{background:var(--pri2)}
.empty{text-align:center;color:var(--mut);padding:20px 0}
.scroll{overflow-x:auto}
.brand{gap:14px;flex-wrap:wrap}.brand small{font-size:12px;line-height:1.3;opacity:.95}
.lg{background:#fff;border-radius:18px;padding:10px 18px 10px 14px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.lt{display:flex;flex-direction:column;line-height:.95;font-family:"Arial Black","Segoe UI",Impact,sans-serif}
.lt b{font-size:25px;font-weight:900;letter-spacing:.5px;color:#1a4a9c}.lt .l2{color:#2db3e8}
.srch{position:relative}.srch input{padding-left:44px}.srch:before{content:"🔍";position:absolute;left:14px;top:13px;font-size:18px}
.sl{max-height:210px;overflow-y:auto;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.opt{display:flex;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.opt:last-child{border:0}.opt.on{background:var(--soft);color:var(--pri2);font-weight:700}
body{background:radial-gradient(900px 520px at 100% 0,rgba(10,165,194,.22),transparent 60%),radial-gradient(700px 520px at 0 45%,rgba(26,74,156,.16),transparent 62%),radial-gradient(650px 450px at 95% 100%,rgba(45,179,232,.20),transparent 60%),radial-gradient(500px 350px at 5% 100%,rgba(20,168,107,.10),transparent 60%),var(--bg);background-attachment:fixed}
header{background:linear-gradient(135deg,#123f87 0%,var(--pri2) 45%,var(--pri) 100%)}
.card{backdrop-filter:blur(8px);border-top:4px solid var(--pri)}
footer{max-width:760px;margin:0 auto;padding:10px 16px 30px;text-align:center;font-size:13px;color:var(--mut)}
footer a{color:var(--pri2);font-weight:700;cursor:pointer;margin:0 8px;text-decoration:underline}
.md{position:fixed;inset:0;background:rgba(5,20,30,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.md[hidden]{display:none}
.mb{background:var(--card);color:var(--tx);width:100%;max-width:760px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));font-size:14px;line-height:1.55}
.mb h2{font-size:19px}.mb h4{margin:16px 0 4px;color:var(--pri2);font-size:14px}.mb p{margin:4px 0}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:var(--mut);font-weight:400;line-height:1.4}
.ck input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--pri)}.ck a{color:var(--pri2);font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand"><div class="lg"><svg viewBox="0 0 90 80" width="58" height="52" aria-label="MANTEN LIMPIO"><polygon points="0,42 30,30 30,78 0,78" fill="#1a4a9c"/><polygon points="30,30 46,35 46,78 30,78" fill="#2db3e8"/><polygon points="46,22 58,10 58,78 46,78" fill="#1a4a9c"/><polygon points="58,10 70,22 70,78 58,78" fill="#2db3e8"/><polygon fill="#fff" points="72,15 73.7,25.8 82.6,19.4 76.2,28.3 87,30 76.2,31.7 82.6,40.6 73.7,34.2 72,45 70.3,34.2 61.4,40.6 67.8,31.7 57,30 67.8,28.3 61.4,19.4 70.3,25.8" transform="translate(-8,-2)"/><path d="M0 60 L40 50" stroke="#fff" stroke-width=".8" stroke-dasharray="3 2" opacity=".6"/></svg><div class="lt"><b>MANTEN</b><b class="l2">LIMPIO</b></div></div><small>Control de ingreso<br>en tiempo real</small></div>
<nav><a href="#/" id="n1">Empleados</a><a href="#/admin" id="n2">Admin</a></nav>
</div></header>
<main id="app"><div class="card empty">Cargando…</div></main>
<footer>© MANTEN LIMPIO · <a onclick="legal('p')">Política de privacidad</a><a onclick="legal('t')">Términos y condiciones</a><a onclick="doLogout()">Salir</a></footer>
<div class="md" id="md" hidden onclick="if(event.target===this)this.hidden=true"><div class="mb"><div id="mc"></div><button class="big" onclick="$('#md').hidden=true">Cerrar</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/adapter.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={db:null,user:null,uid:null,isAdmin:false,sites:[],cfg:{},mine:null,all:[],subs:[],ready:false};
const fmtT=t=>new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const fmtD=t=>new Date(t).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
const dur=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(v=>String(v).padStart(2,"0")).join(":")};
const durS=ms=>{const m=Math.floor(Math.max(0,ms)/60000);return Math.floor(m/60)+"h "+m%60+"m"};
const ini=n=>(n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPos(){return new Promise((ok,ko)=>{if(!navigator.geolocation)return ko({code:0});navigator.geolocation.getCurrentPosition(ok,ko,{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
const gerr=e=>e.code===1?"Permiso de ubicación denegado. Activalo en tu navegador para poder registrar.":e.code===3?"No se pudo obtener tu ubicación a tiempo. Probá al aire libre o con GPS activo.":"Tu dispositivo no permite geolocalización.";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}}

async function init(){
  try{const u=await claude.use("user");S.user=u;if(u){S.uid=await u.id();S.isAdmin=!!(u.canEdit&&u.canEdit())}}catch(e){}
  try{S.db=await claude.use("db")}catch(e){}
  if(S.db){
    S.db.collection("sites").onSnapshot(s=>{S.sites=s.docs.map(d=>({id:d.id,...d.data()}));rerender()});
    S.db.doc("config/main").onSnapshot(s=>{S.cfg=s.data()||{};rerender()});
    S.db.collection("shifts").orderBy("inAt","desc").limit(150).onSnapshot(s=>{
      S.all=s.docs.map(d=>({id:d.id,...d.data()}));
      S.mine=S.all.find(x=>x.uid===S.uid&&x.status==="active")||null;
      rerender()});
  }
  S.ready=true;route();setInterval(tick,1000);
}
let lastView="";
function rerender(){if(!S.ready)return;const f=document.activeElement;if(f&&(f.tagName==="INPUT"||f.tagName==="SELECT"))return;route()}
window.addEventListener("hashchange",()=>{lastView="";route()});
function route(){const a=location.hash.startsWith("#/admin");$("#n1").classList.toggle("on",!a);$("#n2").classList.toggle("on",a);a?adminView():empView()}
function tick(){document.querySelectorAll("[data-since]").forEach(e=>{const ms=Date.now()-+e.dataset.since;e.textContent=e.dataset.f==="s"?durS(ms):dur(ms)})}

function noDb(){return `<div class="card"><h2>Iniciá sesión</h2><label>Email</label><input id="lg_e" type="email" autocomplete="username"><label>Contraseña</label><input id="lg_p" type="password" autocomplete="current-password"><button class="big" onclick="doLogin()">Ingresar</button><div id="lg_m"></div><div class="msg info" style="margin-top:14px">Tu cuenta te la da tu empleador. Si no tenés una, pedila.</div></div>`}

function empView(){
  const app=$("#app");if(!S.db){app.innerHTML=noDb();return}
  if(S.mine){activeView(app);return}
  const sel=ls("ml_site");
  app.innerHTML=`<div class="card"><h2>👋 Registrar ingreso</h2>
  <div class="sec">Tu ubicación y hora se toman automáticamente al registrar.</div>
  <label>Nombre completo</label><input id="nm" value="${esc(ls("ml_name"))}" placeholder="Ej: Laura Gómez" autocomplete="name">
  <label>DNI / Legajo</label><input id="dn" value="${esc(ls("ml_dni"))}" placeholder="Ej: 30123456" inputmode="numeric">
  <label>Edificio / Escuela</label>
  <div class="srch"><input id="sq" placeholder="Buscar edificio o escuela…" autocomplete="off"></div><div class="sl" id="sl"></div>
  <label class="ck"><input type="checkbox" id="cs"><span>Acepto que se registre mi ubicación y hora al fichar, según la <a onclick="legal('p')">Política de privacidad</a> y los <a onclick="legal('t')">Términos</a>.</span></label>
  <button class="big" id="go" ${S.sites.length?"":"disabled"}>📍 Registrar mi ingreso</button>
  <div id="m"></div></div>
  ${S.all.filter(x=>x.uid===S.uid).slice(0,5).length?`<div class="card"><h3>Mis últimos registros</h3>${S.all.filter(x=>x.uid===S.uid).slice(0,5).map(x=>`<div class="row"><div class="i"><b>${esc(x.siteName)}</b><small>${fmtD(x.inAt)} · ${fmtT(x.inAt)}${x.outAt?" – "+fmtT(x.outAt):""}</small></div><span class="tag g">${x.outAt?durS(x.outAt-x.inAt):"activo"}</span></div>`).join("")}</div>`:""}`;
  $("#go").onclick=checkIn;sitesUI();
}
const msg=(t,c)=>{const m=$("#m");if(m)m.innerHTML=`<div class="msg ${c}">${t}</div>`};
async function checkIn(){
  const name=$("#nm").value.trim(),dni=$("#dn").value.trim(),sid=S.selSite||"";
  if(name.length<3||dni.length<4||!sid)return msg("Completá tu nombre, DNI y el lugar.","err");
  if(!$("#cs").checked)return msg("Para registrar tu ingreso tenés que aceptar el uso de tu ubicación y la política de privacidad.","err");
  const site=S.sites.find(s=>s.id===sid);const b=$("#go");b.disabled=true;msg("Obteniendo tu ubicación…","info");
  let p;try{p=await getPos()}catch(e){b.disabled=false;return msg(gerr(e),"err")}
  const c=p.coords,d=dist(c.latitude,c.longitude,site.lat,site.lng);
  if(Math.abs(Date.now()-p.timestamp)>120000){b.disabled=false;return msg("La hora de tu ubicación no es confiable. Reintentá.","err")}
  if(c.accuracy>200){b.disabled=false;return msg(`Ubicación poco precisa (±${Math.round(c.accuracy)} m). Activá el GPS y reintentá.`,"err")}
  if(d>(site.radius||150)+Math.min(c.accuracy,50)){b.disabled=false;return msg(`Estás a ${Math.round(d)} m de ${esc(site.name)}. Debés estar en el lugar para registrar el ingreso.`,"err")}
  ls("ml_name",name);ls("ml_dni",dni);ls("ml_site",sid);
  const rec={uid:S.uid,name,dni,siteId:sid,siteName:site.name,status:"active",inAt:Date.now(),inLat:c.latitude,inLng:c.longitude,inAcc:Math.round(c.accuracy),inDist:Math.round(d)};
  try{await S.db.collection("shifts").add(rec);S.lastIn=rec}catch(e){b.disabled=false;msg("No se pudo guardar. Reintentá.","err")}
}
function notifText(r,out){return `${out?"🔴 SALIDA":"🟢 INGRESO"} – MANTEN LIMPIO\n${r.name} (DNI ${r.dni})\n${r.siteName}\n${out?"Hora: "+fmtT(r.outAt):"Hora: "+fmtT(r.inAt)}\nUbicación: https://maps.google.com/?q=${out?r.outLat:r.inLat},${out?r.outLng:r.inLng}`}
function notifBtns(r,out){
  const t=notifText(r,out),ph=(S.cfg.phone||"").replace(/\D/g,""),em=S.cfg.email||"";
  if(!ph&&!em)return "";
  return `<div class="btns">${ph?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent(t)}">💬 Avisar por WhatsApp</a>`:""}${em?`<a class="em" href="mailto:${esc(em)}?subject=${encodeURIComponent((out?"Salida":"Ingreso")+" – "+r.name)}&body=${encodeURIComponent(t)}">✉️ Avisar por email</a>`:""}</div>`}
function activeView(app){
  const r=S.mine,fresh=Date.now()-r.inAt<600000;
  app.innerHTML=`<div class="card live"><div><span class="pulse"></span><b>Trabajando ahora</b></div>
  <div class="timer" data-since="${r.inAt}">00:00:00</div>
  <div><b>${esc(r.siteName)}</b><br><small style="color:var(--mut)">Ingreso a las ${fmtT(r.inAt)} · ${esc(r.name)}</small></div>
  ${fresh?`<div class="msg ok">✅ Ingreso registrado. Avisale a tu jefe con un toque:</div>${notifBtns(r,false)}`:""}
  <button class="big out" id="out">🚪 Registrar mi salida</button><div id="m"></div></div>`;
  $("#out").onclick=checkOut;tick();
}
async function checkOut(){
  const r=S.mine,b=$("#out");b.disabled=true;msg("Obteniendo tu ubicación…","info");
  let p;try{p=await getPos()}catch(e){b.disabled=false;return msg(gerr(e),"err")}
  const c=p.coords,out={status:"done",outAt:Date.now(),outLat:c.latitude,outLng:c.longitude};
  try{await S.db.doc("shifts/"+r.id).update(out);const done={...r,...out};
    $("#app").innerHTML=`<div class="card live"><h2>👏 ¡Buen trabajo!</h2><div class="msg ok">Salida registrada. Trabajaste ${durS(done.outAt-done.inAt)}.</div>${notifBtns(done,true)}<button class="big" onclick="route()">Volver</button></div>`}
  catch(e){b.disabled=false;msg("No se pudo guardar la salida.","err")}
}

function adminView(){
  const app=$("#app");if(!S.db){app.innerHTML=noDb();return}
  if(!S.isAdmin){app.innerHTML=`<div class="card"><h2>🔒 Acceso restringido</h2><div class="msg err">Esta sección es solo para administradores. Tu cuenta no tiene rol de administrador.</div></div>`;return}
  const act=S.all.filter(x=>x.status==="active"),today=new Date().toDateString(),td=S.all.filter(x=>new Date(x.inAt).toDateString()===today);
  const bySite={};act.forEach(x=>{bySite[x.siteName]=(bySite[x.siteName]||0)+1});
  app.innerHTML=`<div class="card"><h2>📊 Panel en vivo</h2><div class="stats">
  <div class="stat main"><b>${act.length}</b><span>Trabajando ahora</span></div>
  <div class="stat"><b>${td.length}</b><span>Ingresos hoy</span></div>
  <div class="stat"><b>${S.sites.length}</b><span>Lugares</span></div></div>
  ${Object.keys(bySite).length?`<div style="margin-top:12px;font-size:14px;color:var(--mut)">${Object.entries(bySite).map(([k,v])=>`<b style="color:var(--tx)">${esc(k)}</b>: ${v}`).join(" · ")}</div>`:""}</div>
  <div class="card"><h3>🟢 En el trabajo ahora</h3>${act.length?act.map(x=>`<div class="row"><div class="av">${esc(ini(x.name))}</div><div class="i"><b>${esc(x.name)}</b><small>${esc(x.siteName)} · desde ${fmtT(x.inAt)} · ±${x.inAcc} m</small></div><div style="text-align:right"><span class="tag" data-since="${x.inAt}" data-f="s">…</span><br><a class="mini" style="margin-top:6px" target="_blank" rel="noopener" href="https://maps.google.com/?q=${x.inLat},${x.inLng}">📍 Mapa</a></div></div>`).join(""):'<div class="empty">Nadie está trabajando en este momento.</div>'}</div>
  <div class="card"><h3>🕘 Historial reciente</h3><div class="scroll">${S.all.filter(x=>x.status==="done").slice(0,30).map(x=>`<div class="row"><div class="av">${esc(ini(x.name))}</div><div class="i"><b>${esc(x.name)}</b><small>${esc(x.siteName)} · ${fmtD(x.inAt)} ${fmtT(x.inAt)} – ${fmtT(x.outAt)}</small></div><span class="tag g">${durS(x.outAt-x.inAt)}</span></div>`).join("")||'<div class="empty">Sin registros aún.</div>'}</div></div>
  <div class="card"><h3>🏢 Edificios / Escuelas</h3>${S.sites.map(s=>`<div class="row"><div class="i"><b>${esc(s.name)}</b><small>Radio ${s.radius} m · ${(+s.lat).toFixed(5)}, ${(+s.lng).toFixed(5)}</small></div><button class="mini d" data-del="${s.id}">Borrar</button></div>`).join("")||'<div class="empty">Cargá el primer lugar de trabajo.</div>'}
  <label>Nombre del lugar</label><input id="sn" placeholder="Ej: Escuela N° 12">
  <div class="two"><div><label>Latitud</label><input id="sa" inputmode="decimal"></div><div><label>Longitud</label><input id="so" inputmode="decimal"></div></div>
  <label>Radio permitido (metros)</label><input id="sr" value="150" inputmode="numeric">
  <div class="btns"><button class="mini" id="here" style="flex:1">📍 Usar mi ubicación actual</button><button class="mini" id="addS" style="flex:1">➕ Agregar lugar</button></div><div id="m"></div></div>
  <div class="card"><h3>🔔 Avisos al jefe</h3>
  <label>WhatsApp (con código de país, ej: 5492215551234)</label><input id="ph" value="${esc(S.cfg.phone||"")}" inputmode="tel">
  <label>Email</label><input id="em" value="${esc(S.cfg.email||"")}" type="email">
  <button class="big" id="saveC" style="margin-top:14px">Guardar avisos</button><div id="m2"></div></div>`;
  $("#here").onclick=async()=>{msg("Buscando ubicación…","info");try{const p=await getPos();$("#sa").value=p.coords.latitude.toFixed(6);$("#so").value=p.coords.longitude.toFixed(6);msg("Ubicación cargada. Poné el nombre y agregá.","ok")}catch(e){msg(gerr(e),"err")}};
  $("#addS").onclick=async()=>{const n=$("#sn").value.trim(),la=parseFloat($("#sa").value),lo=parseFloat($("#so").value),r=parseInt($("#sr").value)||150;
    if(!n||isNaN(la)||isNaN(lo))return msg("Completá nombre y coordenadas.","err");
    try{await S.db.collection("sites").add({name:n,lat:la,lng:lo,radius:r})}catch(e){msg("No se pudo guardar (¿tenés permiso de admin?).","err")}};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("¿Borrar este lugar?"))S.db.doc("sites/"+b.dataset.del).delete()});
  $("#saveC").onclick=async()=>{try{await S.db.doc("config/main").set({phone:$("#ph").value.trim(),email:$("#em").value.trim()});$("#m2").innerHTML='<div class="msg ok">Guardado ✅</div>'}catch(e){$("#m2").innerHTML='<div class="msg err">No se pudo guardar.</div>'}};
  tick();
}
function sitesUI(){
 if(!S.selSite&&S.sites.some(s=>s.id===ls("ml_site")))S.selSite=ls("ml_site");
 const q=$("#sq"),l=$("#sl");if(!q)return;
 const draw=()=>{const t=q.value.trim().toLowerCase(),f=S.sites.filter(s=>s.name.toLowerCase().includes(t));
  l.innerHTML=!S.sites.length?'<div class="empty">No hay lugares cargados</div>':f.length?f.map(s=>`<div class="opt ${s.id===S.selSite?"on":""}" data-id="${s.id}"><span>🏢 ${esc(s.name)}</span>${s.id===S.selSite?"<b>✓</b>":""}</div>`).join(""):'<div class="empty">Sin resultados</div>';
  l.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{S.selSite=o.dataset.id;draw()})};
 q.oninput=draw;draw()}
